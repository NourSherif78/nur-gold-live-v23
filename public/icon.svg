<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="10" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="195" fill="#0F172A" stroke="rgba(212, 175, 55, 0.25)" stroke-width="2"/>

  <!-- Gold Bullion Ingot (Trapezoid 3D) -->
  <g filter="url(#goldGlow)">
    <!-- Base Bar -->
    <rect x="136" y="180" width="240" height="152" rx="16" fill="url(#goldBarGrad)" stroke="#FEF08A" stroke-width="3"/>
    
    <!-- Top Face Highlight -->
    <polygon points="152,192 360,192 344,220 168,220" fill="rgba(255, 255, 255, 0.45)"/>
    
    <!-- Text on Gold Ingot -->
    <text x="256" y="260" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="44" fill="#78350F" text-anchor="middle" letter-spacing="3">999.9</text>
    <text x="256" y="302" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="24" fill="#92400E" text-anchor="middle" letter-spacing="6">FINE GOLD</text>
  </g>

  <!-- Sparkles -->
  <path d="M 370 140 Q 385 155 400 155 Q 385 155 370 170 Q 385 155 370 140" fill="#FEF08A"/>
  <circle cx="130" cy="350" r="4" fill="#FCD34D"/>
  <circle cx="390" cy="340" r="3" fill="#FCD34D"/>
</svg>
